services:
  - type: web
    name: appingles-api
    runtime: node
    buildCommand: cd api && npm ci
    startCommand: cd api && node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORE_MODE
        value: firebase
      - key: FIREBASE_PROJECT_ID
        value: appingles-app
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
