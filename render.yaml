services:
  - type: web
    name: appingles-api
    runtime: node
    buildCommand: cd api && npm ci
    startCommand: cd api && node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: STORE_MODE
        value: firebase
      - key: FIREBASE_PROJECT_ID
        value: appingles-app
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: ACTIVATION_URL
        value: https://www.ingresosdigitalesit.com/appingles/activar
      - key: MAIL_FROM
        value: acceso@ingresosdigitalesit.com
      - key: MAIL_HOST
        value: smtp.hostinger.com
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_SECURE
        value: "true"
      - key: MAIL_USER
        value: ingresosdigitales@ingresosdigitalesit.com
      - key: MAIL_PASSWORD
        sync: false
      - key: SUPPORT_EMAIL
        value: acceso@ingresosdigitalesit.com
      - key: APP_PUBLIC_URL
        value: https://www.ingresosdigitalesit.com
      - key: RESEND_MAX_PER_HOUR
        value: "10"
